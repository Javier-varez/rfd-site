apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfd-site
  labels:
    app.kubernetes.io/name: rfd-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rfd-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rfd-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rfd-site
          # Replace this with the immutable image reference published by your CI pipeline.
          image: rfd-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: rfd-site-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rfd-site
  labels:
    app.kubernetes.io/name: rfd-site
spec:
  selector:
    app.kubernetes.io/name: rfd-site
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
